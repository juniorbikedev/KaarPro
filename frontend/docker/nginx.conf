server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Photos des véhicules et des états des lieux (plusieurs fichiers par envoi)
    client_max_body_size 60m;

    # API Laravel : toutes les requêtes /api passent par public/index.php dans le conteneur « api »
    location /api/ {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Fichiers compilés par Vite : leur nom change à chaque version, ils peuvent être gardés longtemps
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute autre adresse renvoie index.html (React Router fait le reste)
    # Les réponses de l'API portent déjà leurs en-têtes de sécurité (Laravel) ; ceux-ci couvrent l'interface
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
