# Intégration et déploiement continus de KaarPro
#  1. À chaque push et pull request : tests de l'API sur PostgreSQL, lint et compilation de l'interface.
#  2. Sur main : construction des images Docker et publication sur GitHub Container Registry (ghcr.io).
#  3. Sur main, si la variable DEPLOIEMENT_ACTIF vaut « true » : mise à jour du serveur par SSH.
name: CI/CD

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Tests de l'API (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kaarpro_tests
          POSTGRES_USER: kaarpro
          POSTGRES_PASSWORD: kaarpro-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kaarpro -d kaarpro_tests"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kaarpro_tests
      DB_USERNAME: kaarpro
      DB_PASSWORD: kaarpro-ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, gd
          coverage: none
      - name: Dépendances
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configuration
        run: cp .env.example .env && php artisan key:generate
      - name: Tests
        run: php artisan test

  interface:
    name: Lint et compilation de l'interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    name: Images Docker
    needs: [api, interface]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'api' && 'backend' || 'frontend' }}
          push: true
          tags: |
            ghcr.io/juniorbikedev/kaarpro-${{ matrix.image }}:latest
            ghcr.io/juniorbikedev/kaarpro-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploiement:
    name: Déploiement sur le serveur
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOIEMENT_ACTIF == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVEUR_HOTE }}
          username: ${{ secrets.SERVEUR_UTILISATEUR }}
          key: ${{ secrets.SERVEUR_CLE_SSH }}
          script: |
            cd /opt/kaarpro
            git pull --ff-only
            docker compose -f docker-compose.prod.yml --env-file .env.production pull
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
            docker image prune -f
