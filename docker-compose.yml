# KaarPro sur le poste, avec Docker et PostgreSQL : docker compose up -d --build
#   Application : http://localhost:8080   (comptes de démonstration : voir backend/.env)
#   Base seule, pour développer avec dev-api.ps1 : docker compose up -d postgres
# Les réglages (APP_KEY, comptes, commissions…) viennent de backend/.env ; ceux propres à Docker sont fixés ci-dessous.
name: kaarpro

services:
  postgres:
    image: postgres:16-alpine
    container_name: kaarpro-postgres
    environment:
      POSTGRES_DB: kaarpro
      POSTGRES_USER: kaarpro
      POSTGRES_PASSWORD: kaarpro-dev
    ports:
      # 5433 côté poste : le port 5432 est souvent pris par un PostgreSQL installé sur Windows
      - "5433:5432"
    volumes:
      - kaarpro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaarpro -d kaarpro"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: kaarpro-api:local
    env_file: ./backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: kaarpro
      DB_USERNAME: kaarpro
      DB_PASSWORD: kaarpro-dev
      APP_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      SEED_DEMO: "true"
      LOG_CHANNEL: stderr
    volumes:
      - kaarpro-fichiers:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    image: kaarpro-web:local
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  kaarpro-pgdata:
  kaarpro-fichiers:
